services:
  postgres:
    image: postgres:17
    container_name: boat-warranty-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boat_warranty

    ports:
      - "5433:5432"

    volumes:
      - boat_warranty_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d boat_warranty"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .

    container_name: boat-warranty-server
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/boat_warranty?schema=public
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      NODE_ENV: production

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  boat_warranty_postgres_data: